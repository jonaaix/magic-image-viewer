<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Page with ads</title>
        <script src="fixture.js"></script>
        <style>
            body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; }
            .ad { position: fixed; inset: 25% 25%; z-index: 2147483647; display: flex; align-items: center; justify-content: center; background: #facc15; font: 700 32px system-ui; }
        </style>
    </head>
    <body>
        <h1>Page with ads</h1>
        <img src="images/photo-1.svg" alt="Photo" width="480" />
        <div id="banner" popover="manual" style="inset: auto 0 0 0; width: 100%; height: 50vh; background: #f97316">Cookie banner</div>
        <script>
            window.showAd = () => {
                const ad = document.createElement('div');
                ad.className = 'ad';
                ad.textContent = 'Advertisement';
                document.body.append(ad);
            };
            window.showBanner = () => document.getElementById('banner').showPopover();
        </script>
    </body>
</html>
