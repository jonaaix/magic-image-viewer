<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Carousels</title>
        <script src="fixture.js"></script>
        <style>
            body { font-family: system-ui, sans-serif; margin: 24px; }
            .frame { width: 300px; overflow: hidden; margin-bottom: 24px; }
            .track { display: flex; transition: transform 0.15s; }
            .track img { width: 300px; height: 200px; flex: none; display: block; }
            #pointer-carousel { touch-action: pan-y; }
            #free { width: 300px; display: block; }
            #site-lightbox { position: fixed; inset: 0; background: rgb(0 0 0 / 0.8); display: none; }
            #site-lightbox.open { display: block; }
        </style>
    </head>
    <body>
        <div id="pointer-carousel" class="frame">
            <div class="track">
                <img src="images/photo-1.svg" alt="Slide 1" />
                <img src="images/photo-2.svg" alt="Slide 2" />
                <img src="images/photo-3.svg" alt="Slide 3" />
            </div>
        </div>

        <div id="library-carousel" class="frame swiper">
            <div class="track">
                <img src="images/photo-4.svg" alt="Slide 4" />
                <img src="images/photo-5-1600.svg" alt="Slide 5" />
                <img src="images/photo-6-large.svg" alt="Slide 6" />
            </div>
        </div>

        <img id="free" src="images/photo-7-full.svg" alt="Free" draggable="false" />

        <div id="site-lightbox"></div>

        <script>
            window.siteLog = [];
            window.slides = {};
            const SWIPE_DISTANCE = 50;

            function carousel(frame, { press, move, release, pointOf }) {
                const track = frame.querySelector('.track');
                const count = track.children.length;
                let index = 0;
                let start = null;
                window.slides[frame.id] = 0;

                const show = (offset = 0) => (track.style.transform = `translateX(${-index * frame.clientWidth + offset}px)`);

                frame.addEventListener('dragstart', (event) => event.preventDefault());
                frame.addEventListener(press, (event) => {
                    start = pointOf(event);
                    event.pointerId !== undefined && frame.setPointerCapture(event.pointerId);
                });
                window.addEventListener(move, (event) => start !== null && show(pointOf(event) - start));
                window.addEventListener(release, (event) => {
                    if (start === null) {
                        return;
                    }

                    const delta = pointOf(event) - start;
                    start = null;

                    if (Math.abs(delta) > SWIPE_DISTANCE) {
                        index = Math.min(count - 1, Math.max(0, index - Math.sign(delta)));
                        window.slides[frame.id] = index;
                    }

                    show();
                });
            }

            carousel(document.getElementById('pointer-carousel'), {
                press: 'pointerdown', move: 'pointermove', release: 'pointerup', pointOf: (event) => event.clientX,
            });
            carousel(document.getElementById('library-carousel'), {
                press: 'mousedown', move: 'mousemove', release: 'mouseup', pointOf: (event) => event.clientX,
            });

            const box = document.getElementById('site-lightbox');
            for (const image of document.querySelectorAll('img')) {
                image.addEventListener('click', () => {
                    window.siteLog.push(`click:${image.alt}`);
                    box.classList.add('open');
                });
            }
            document.getElementById('free').addEventListener('pointerup', () => window.siteLog.push('pointerup:Free'));
        </script>
    </body>
</html>
