<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Sources</title>
        <script src="fixture.js"></script>
        <style>
            body { font-family: system-ui, sans-serif; margin: 24px; }
            img { display: block; margin: 16px 0; }
            .wide { width: 400px; }
            .spacer { height: 2400px; }
        </style>
    </head>
    <body>
        <img id="srcset" class="wide" src="images/photo-5-400.svg" srcset="images/photo-5-400.svg 400w, images/photo-5-1600.svg 1600w" sizes="400px" alt="Srcset" />

        <picture>
            <source type="image/svg+xml" srcset="images/photo-6-small.svg 400w, images/photo-6-large.svg 2000w" sizes="400px" />
            <img id="picture" class="wide" src="images/photo-6-small.svg" alt="Picture" />
        </picture>

        <a href="images/photo-8-full.svg"><img id="linked" src="images/photo-8-thumb.svg" width="160" height="107" alt="Linked thumbnail" /></a>

        <a href="wiki/File:Lighthouse.svg"><img id="file-page" class="wide" src="images/late.svg" alt="Link to a file page" /></a>

        <div class="spacer"></div>

        <img id="lazy" class="wide" loading="lazy" width="400" height="267" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" data-src="images/photo-7-full.svg" alt="Lazy" />
    </body>
</html>
