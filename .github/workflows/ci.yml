name: CI

on:
    push:
        branches: ['**']
        tags: ['v*']
    pull_request:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Fetch git dependencies over HTTPS
              run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

            - run: npm ci

            - name: Install Chromium for Playwright
              run: npx playwright install --with-deps chromium

            - name: Unit and browser tests
              run: npm test

            - name: Build both packages
              run: |
                  npm run build
                  npm run build:firefox

            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: test-results
                  path: test-results/
                  retention-days: 7

    release:
        needs: test
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Fetch git dependencies over HTTPS
              run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

            - run: npm ci

            - name: Build store packages
              run: |
                  npm run zip
                  npm run zip:firefox

            - name: Attach packages to the release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  awk -v heading="## ${GITHUB_REF_NAME#v}" '/^## / { take = index($0, heading) == 1; next } take' CHANGELOG.md > release-notes.md
                  gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes-file release-notes.md
